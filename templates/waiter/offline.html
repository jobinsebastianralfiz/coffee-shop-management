<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F3F3F1">
    <title>Offline | Waiter App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
            font-weight: 400;
            color: #1E1E1E;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(120% 90% at 100% 100%, #F8E7A6 0%, rgba(248, 231, 166, 0.35) 45%, transparent 70%),
                radial-gradient(70% 60% at 100% 0%, rgba(248, 231, 166, 0.55), transparent 60%),
                #F3F3F1;
            background-attachment: fixed;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            background: #FFFFFF;
            border-radius: 28px;
            padding: 28px 20px 20px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(30, 30, 40, 0.14);
        }

        .icon {
            width: 64px;
            height: 64px;
            background: #2A2A2C;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .icon svg {
            width: 28px;
            height: 28px;
            color: #F5C842;
        }

        h1 {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: #1E1E1E;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #5E5E62;
            margin-bottom: 20px;
            line-height: 1.5;
            font-size: 14px;
        }

        .feature-box {
            background: #F3F3F1;
            border-radius: 22px;
            padding: 14px 16px;
            margin-bottom: 10px;
            text-align: left;
        }

        .feature-box h3 {
            color: #1E1E1E;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-box h3 svg {
            width: 18px;
            height: 18px;
            padding: 3px;
            border-radius: 50%;
            background: #D1FAE5;
            color: #047857;
            box-sizing: content-box;
        }

        .feature-box p {
            color: #5E5E62;
            font-size: 13px;
            line-height: 1.5;
        }

        .pending-box {
            background: #F5C842;
            border-radius: 22px;
            padding: 14px 16px;
            margin-bottom: 20px;
            text-align: left;
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-areas: "title count" "label count";
            align-items: center;
            column-gap: 12px;
        }

        .pending-box h3 {
            grid-area: title;
            color: #1E1E1E;
            font-size: 14px;
            font-weight: 500;
        }

        .pending-count {
            grid-area: count;
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            color: #1E1E1E;
        }

        .pending-label {
            grid-area: label;
            font-size: 12px;
            color: #5A4A12;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 48px;
            background: #2A2A2C;
            color: #F4F4F4;
            border: none;
            padding: 0 20px;
            border-radius: 999px;
            font-family: inherit;
            font-weight: 400;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.15s;
            text-decoration: none;
            margin-bottom: 8px;
        }

        .btn:hover {
            background: #3A3A3D;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: #F3F3F1;
            color: #1E1E1E;
        }

        .btn-secondary:hover {
            background: #EBEBE8;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            padding: 5px 12px;
            border-radius: 999px;
            background: #F3F3F1;
            font-size: 12px;
            color: #5E5E62;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #DC4A3D;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: #10B981;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path>
            </svg>
        </div>

        <h1>You're Offline</h1>
        <p class="subtitle">Don't worry - you can still take orders!</p>

        <div class="feature-box">
            <h3>
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Offline Mode Enabled
            </h3>
            <p>Your orders will be saved locally and automatically synced when you're back online.</p>
        </div>

        <div class="pending-box" id="pendingBox">
            <h3>Pending Orders</h3>
            <div class="pending-count" id="pendingCount">0</div>
            <div class="pending-label">orders waiting to sync</div>
        </div>

        <a href="/waiter/tables/" class="btn">
            View Tables & Take Orders
        </a>

        <button onclick="window.location.reload()" class="btn btn-secondary">
            Check Connection
        </button>

        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Offline</span>
        </div>
    </div>

    <script>
        // Check for pending orders
        async function checkPendingOrders() {
            try {
                const DB_NAME = 'kaffero-offline';
                const request = indexedDB.open(DB_NAME, 1);

                request.onsuccess = function() {
                    const db = request.result;
                    if (db.objectStoreNames.contains('pending_orders')) {
                        const tx = db.transaction('pending_orders', 'readonly');
                        const store = tx.objectStore('pending_orders');
                        const countRequest = store.count();

                        countRequest.onsuccess = function() {
                            const count = countRequest.result;
                            document.getElementById('pendingCount').textContent = count;
                            if (count === 0) {
                                document.getElementById('pendingBox').style.display = 'none';
                            }
                        };
                    }
                };
            } catch (e) {
                console.error('Failed to check pending orders:', e);
            }
        }

        // Monitor connection status
        function updateConnectionStatus() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (navigator.onLine) {
                statusDot.classList.add('online');
                statusText.textContent = 'Back Online!';

                // Redirect to home after a moment
                setTimeout(() => {
                    window.location.href = '/waiter/';
                }, 1500);
            } else {
                statusDot.classList.remove('online');
                statusText.textContent = 'Offline';
            }
        }

        // Initialize
        checkPendingOrders();
        updateConnectionStatus();

        // Listen for online/offline events
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
    </script>
</body>
</html>

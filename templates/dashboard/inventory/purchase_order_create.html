{% extends 'base.html' %}

{% block title %}Create Purchase Order{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="fade-in space-y-4">
    <!-- Header -->
    <div class="kf-pagehead">
        <div class="flex items-center gap-3 min-w-0">
            <a href="{% url 'dashboard:purchase_orders' %}" class="kf-arrow kf-arrow-light !w-10 !h-10" aria-label="Back">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </a>
            <p>Create a new purchase order for inventory restocking</p>
        </div>
    </div>

    <!-- Form -->
    <div class="kf-card p-5 max-w-2xl">
        <div class="kf-cardhead mb-3">
            <h3 class="kf-h">Order Details</h3>
        </div>
        <form method="POST" class="grid sm:grid-cols-2 gap-3">
            {% csrf_token %}
            <div>
                <label class="kf-label">Supplier *</label>
                <select name="supplier" required class="kf-input">
                    <option value="">Select a Supplier</option>
                    {% for supplier in suppliers %}
                    <option value="{{ supplier.pk }}">{{ supplier.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="kf-label">Expected Delivery Date</label>
                <input type="date" name="expected_date" class="kf-input">
            </div>
            <div class="sm:col-span-2">
                <label class="kf-label">Notes</label>
                <textarea name="notes" rows="3" class="kf-input" placeholder="Additional notes for this order..."></textarea>
            </div>
            <div class="sm:col-span-2 flex justify-end gap-2 pt-1">
                <a href="{% url 'dashboard:purchase_orders' %}" class="btn-secondary !h-10 !px-4 !text-[13px]">
                    Cancel
                </a>
                <button type="submit" class="btn-primary !h-10 !px-4 !text-[13px]">
                    Create Order
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% comment %}Table guest code card. Needs: table, next_url{% endcomment %}
<div class="kf-card p-4 flex items-center gap-3">
    <div class="min-w-0 flex-1">
        <p class="text-xs text-slate-600">Table code for guests</p>
        <p class="text-[28px] font-light tabular tracking-[0.3em] leading-tight">{{ table.guest_code|default:"----" }}</p>
        <p class="text-xs text-slate-500">Tell guests ordering by QR. Changes when the table is freed.</p>
    </div>
    <form method="post" action="{% url 'dashboard:table_new_code' table.pk %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        <button type="submit" class="btn-secondary !h-9 !px-4 !text-[13px]">New code</button>
    </form>
</div>

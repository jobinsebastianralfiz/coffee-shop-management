{% extends "ordering/base.html" %}

{% block title %}Service Unavailable{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="kf-card w-full max-w-sm p-6 text-center">
        <span class="kf-ic is-lg !w-16 !h-16 mx-auto mb-4">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </span>
        <h1 class="kf-hello !text-[26px] mb-2">Service Temporarily Unavailable</h1>
        <p class="text-sm text-slate-600 mb-5">{{ message }}</p>
        <p class="kf-tag ys !whitespace-normal">Please ask a staff member for assistance.</p>
        {% if table %}
        <a href="{% url 'ordering:menu' table_uuid=table.uuid %}" class="btn-yellow w-full !h-12 mt-5">View the menu</a>
        {% endif %}
    </div>
</div>
{% endblock %}
